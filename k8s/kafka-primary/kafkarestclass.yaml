apiVersion: platform.confluent.io/v1beta1
kind: KafkaRestClass
metadata:
  name: kafka-rest
  namespace: kafka-primary
spec:
  kafkaClusterRef:
    name: kafka
  kafkaRest:
    authentication:
      type: basic
      basic: { secretRef: rest-client-credentials }
    tls:
      secretRef: demo-ca-pem
