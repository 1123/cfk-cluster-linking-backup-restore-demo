apiVersion: platform.confluent.io/v1beta1
kind: KRaftController
metadata:
  name: kraftcontroller
  namespace: kafka-primary
spec:
  replicas: 3
  dataVolumeCapacity: 10Gi
  storageClass:
    name: premium-rwo
  image:
    application: confluentinc/cp-server:8.4.0
    init: confluentinc/confluent-init-container:3.4.0
  tls:
    autoGeneratedCerts: true          # signed by ca-pair-sslcerts (demo CA)
  listeners:
    controller:
      tls: { enabled: true }
      authentication: { type: mtls }
  configOverrides:
    jvm: [ "-Xms1g", "-Xmx1g" ]
  podTemplate:
    resources:
      requests: { cpu: 500m, memory: 2Gi }
      limits: { memory: 2Gi }
    tolerations:
      - { key: dedicated, operator: Equal, value: kafka, effect: NoSchedule }
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions: [ { key: role, operator: In, values: [kafka] } ]
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: DoNotSchedule
        labelSelector: { matchLabels: { app: kraftcontroller } }
