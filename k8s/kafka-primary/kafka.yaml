apiVersion: platform.confluent.io/v1beta1
kind: Kafka
metadata:
  name: kafka
  namespace: kafka-primary
spec:
  replicas: 3
  dataVolumeCapacity: 50Gi
  storageClass:
    name: premium-rwo
  image:
    application: confluentinc/cp-server:8.4.0
    init: confluentinc/confluent-init-container:3.4.0
  tls:
    autoGeneratedCerts: true          # signed by ca-pair-sslcerts (demo CA)
  passwordEncoder:
    secretRef: password-encoder-secret  # encrypts cluster link credentials
  listeners:
    internal:
      tls: { enabled: true }
      authentication: { type: mtls }
    replication:
      tls: { enabled: true }
      authentication: { type: mtls }
    custom:
      - name: oauth                     # clients + cluster links: SASL_SSL / OAUTHBEARER (Keycloak)
        port: 9094
        tls: { enabled: true }
        authentication:
          type: oauth
          jaasConfig: { secretRef: oauth-jaas-broker }
          oauthSettings:
            subClaimName: client_id
            audience: kafka
            expectedIssuer: https://keycloak-service.keycloak.svc.cluster.local:8443/realms/kafka-demo
            jwksEndpointUri: https://keycloak-service.keycloak.svc.cluster.local:8443/realms/kafka-demo/protocol/openid-connect/certs
            tokenEndpointUri: https://keycloak-service.keycloak.svc.cluster.local:8443/realms/kafka-demo/protocol/openid-connect/token
  services:
    kafkaRest:                          # embedded Admin REST v3 – used by CFK for topics and cluster links
      authentication:
        type: basic
        basic:
          secretRef: rest-credentials
          roles: [ Administrators ]
  dependencies:
    kRaftController:
      controllerListener:
        tls: { enabled: true }
        authentication: { type: mtls }
      clusterRef: { name: kraftcontroller }
  configOverrides:
    server:
      - auto.create.topics.enable=false   # CRITICAL for E/F: running producers must not create regular topics
      - default.replication.factor=3
      - min.insync.replicas=2
    jvm:
      - -Xms4g
      - -Xmx4g
      # Broker JVM must trust the demo CA when calling Keycloak (JWKS / token endpoint)
      - -Djavax.net.ssl.trustStore=/mnt/jvmtruststore/truststore.jks
      - -Djavax.net.ssl.trustStorePassword=mystorepassword
      - -Dorg.apache.kafka.sasl.oauthbearer.allowed.urls=https://keycloak-service.keycloak.svc.cluster.local:8443/realms/kafka-demo/protocol/openid-connect/token,https://keycloak-service.keycloak.svc.cluster.local:8443/realms/kafka-demo/protocol/openid-connect/certs
  mountedVolumes:
    volumes:
      - name: jvmtruststore
        secret: { secretName: jvm-truststore }
    volumeMounts:
      - name: jvmtruststore
        mountPath: /mnt/jvmtruststore
  podTemplate:
    resources:
      requests: { cpu: "2", memory: 8Gi }
      limits: { memory: 8Gi }
    tolerations:
      - { key: dedicated, operator: Equal, value: kafka, effect: NoSchedule }
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions: [ { key: role, operator: In, values: [kafka] } ]
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: DoNotSchedule
        labelSelector: { matchLabels: { app: kafka } }
